name: atlasoft_syndic

services:
  app:
    build:
      context: ./docker/php
    container_name: atlasoft_syndic_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: atlasoft_syndic_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./backend:/var/www/backend
      - ./frontend/dist:/var/www/frontend
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: atlasoft_syndic_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: atlasoft_syndic
      MYSQL_USER: atlasoft_syndic
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - atlasoft_syndic_mysql_data:/var/lib/mysql
    # Not published to the host on purpose — only the app container needs
    # it (reaches it via the "db" service name on Docker's internal
    # network). Add a "ports:" mapping here only if you need to connect an
    # external DB client, and pick a host port that isn't already taken by
    # the atlasoft-commerce stack (which already uses 3307).

volumes:
  atlasoft_syndic_mysql_data:
    name: atlasoft_syndic_mysql_data
