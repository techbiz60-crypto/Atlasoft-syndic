# Requests for the real domain get redirected to HTTPS — except the ACME
# challenge path, which certbot needs reachable over plain HTTP to renew
# the certificate. Matched by server_name before the catch-all block below,
# so this only affects syndic.atlasoft.app, not the bare-IP/:8082 access.
server {
    listen 80;
    server_name syndic.atlasoft.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name syndic.atlasoft.app;

    ssl_certificate     /etc/letsencrypt/live/syndic.atlasoft.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syndic.atlasoft.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/frontend;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        root /var/www/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location /sanctum/ {
        root /var/www/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location /email/ {
        root /var/www/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.ht {
        deny all;
    }
}

# Anything else on port 80 — bare IP, or an old :8082 bookmark now that
# that port mapping is gone — used to serve the app in plain HTTP, which
# meant a login submitted this way sent the password unencrypted. Now
# just forwards to the real HTTPS domain instead of serving anything
# itself. default_server so it — not the domain block above, which would
# otherwise become the implicit default as the first "listen 80" block in
# this file — catches any Host header that isn't the domain.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://syndic.atlasoft.app$request_uri;
    }
}
