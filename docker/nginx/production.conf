server {
    listen 80;
    server_name _;

    # The built React app (frontend/dist) — served for everything except
    # the API/Sanctum paths below, with a fallback to index.html so
    # client-side routes (e.g. /cotisations) work on a hard refresh.
    root /var/www/frontend;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        root /var/www/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location /sanctum/ {
        root /var/www/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # The nginx container mounts the backend at /var/www/backend, but
        # the app (PHP-FPM) container mounts the SAME code at /var/www/html
        # (see docker-compose.prod.yml) — SCRIPT_FILENAME is resolved by
        # PHP-FPM on ITS OWN filesystem, so it must use the app container's
        # path, not nginx's $document_root (which would 404 on the app
        # side with PHP-FPM's own "File not found.").
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.ht {
        deny all;
    }
}
