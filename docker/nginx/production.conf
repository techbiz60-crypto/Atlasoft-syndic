# ── commerce.atlasoft.app — Atlasoft Commerce, a separate app on this same
# VPS. Its own containers publish directly on the host (nginx on :8000,
# Next.js frontend on :3000); this box's docker-proxy on 80/443 is the only
# thing free to bind those ports, so it also fronts commerce's domain and
# reverse-proxies to those host ports via the bridge gateway IP (this
# nginx container's default gateway, since custom bridge networks route
# host-published ports through it).
server {
    listen 80;
    server_name commerce.atlasoft.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name commerce.atlasoft.app;

    ssl_certificate     /etc/letsencrypt/live/commerce.atlasoft.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commerce.atlasoft.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 55m;

    location ~ ^/(api|sanctum|storage|up)(/|$) {
        proxy_pass http://172.19.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://172.19.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Anything else on port 80 — bare IP, or an old :8082 bookmark now that
# that port mapping is gone — used to serve the app in plain HTTP, which
# meant a login submitted this way sent the password unencrypted. Now
# just forwards to the real HTTPS domain instead of serving anything
# itself. default_server so it — not the domain block above, which would
# otherwise become the implicit default as the first "listen 80" block in
# this file — catches any Host header that isn't the domain.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://syndic.atlasoft.app$request_uri;
    }
}

# Atlasoft Facturation (facturation.atlasoft.app).
#
# Ce projet vit dans ses propres conteneurs, derriere son propre nginx publie
# sur 172.19.0.1:8083 ; ce nginx-ci detient les ports 80/443 de la machine,
# il est donc le seul a pouvoir terminer le TLS pour ce domaine.
#
# Ce bloc doit rester dans le depot : il avait ete ajoute directement sur le
# serveur, et le deploiement du 23/09/2026 l'a efface en reecrivant ce
# fichier depuis git — facturation.atlasoft.app est alors tombe dans le bloc
# par defaut, servant le certificat et l'application de Syndic.
server {
    listen 80;
    server_name facturation.atlasoft.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name facturation.atlasoft.app;

    ssl_certificate     /etc/letsencrypt/live/facturation.atlasoft.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/facturation.atlasoft.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 55m;

    # Un seul proxy_pass : le nginx du projet distingue lui-meme l'API du
    # frontend derriere ce port.
    location / {
        proxy_pass http://172.19.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
