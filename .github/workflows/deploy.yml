name: Deploy

on:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, gd, zip

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - run: cp .env.example .env

      - run: php artisan key:generate

      - run: php artisan test --compact

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      # frontend/.env.production is gitignored (the example file documents
      # the shape) — rebuilt here from repo secrets/variables so the build
      # step picks it up the same way `npm run build` does locally.
      - name: Write .env.production
        run: |
          echo "VITE_API_URL=" >> .env.production
          echo "VITE_CONTACT_WHATSAPP_NUMBER=${{ vars.CONTACT_WHATSAPP_NUMBER }}" >> .env.production
          echo "VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}" >> .env.production

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest code and install backend dependencies
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/Atlasoft-syndic
            git fetch origin main
            git reset --hard origin/main
            docker exec atlasoft_syndic_app composer install --no-interaction --prefer-dist --optimize-autoloader
            docker exec atlasoft_syndic_app php artisan migrate --force --no-interaction
          '

      - name: Deploy the frontend build
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} 'rm -rf /opt/Atlasoft-syndic/frontend/dist && mkdir -p /opt/Atlasoft-syndic/frontend/dist'
          scp -r dist/* root@${{ secrets.DEPLOY_HOST }}:/opt/Atlasoft-syndic/frontend/dist/

      - name: Recreate containers (picks up new vendor/, env, and dist/)
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/Atlasoft-syndic
            docker compose -f docker-compose.prod.yml up -d --force-recreate app scheduler webserver
          '

      - name: Smoke test
        run: |
          sleep 5
          status=$(curl -s -o /dev/null -w "%{http_code}" https://syndic.atlasoft.app/)
          if [ "$status" != "200" ]; then
            echo "Site returned $status after deploy"
            exit 1
          fi
